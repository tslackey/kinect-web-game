<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Kinect Web Game — a browser playground for motion play."
    />
    <title>Kinect Web Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true">
      <div class="grid"></div>
      <div class="glow glow-a"></div>
      <div class="glow glow-b"></div>
      <canvas id="motion-field" width="960" height="540"></canvas>
    </div>

    <header class="hud">
      <p class="brand">Kinect Web Game</p>
      <h1>Input → game → render</h1>
      <p class="lede">
        The tick loop is live. The marker orbits on its own; move the pointer to
        steer it. Webcam and Kinect come later behind this same input stub.
      </p>
      <p class="status" id="status" role="status">Starting loop…</p>
      <a class="btn ghost" href="https://github.com/tslackey/kinect-web-game"
        >View on GitHub</a
      >
    </header>

    <script type="module" src="./main.js"></script>
  </body>
</html>
