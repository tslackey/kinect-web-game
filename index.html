<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Kinect Web Game — hit floating orbs with your hands."
    />
    <title>Kinect Web Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true">
      <div class="grid"></div>
      <div class="glow glow-a"></div>
      <div class="glow glow-b"></div>
      <canvas id="motion-field" width="960" height="540"></canvas>
    </div>

    <header class="hud">
      <p class="brand">Kinect Web Game</p>
      <h1 id="headline">Hit the orbs</h1>
      <p class="lede">
        Reach with either hand. Miss one and the attempt ends. The pointer
        works if the camera is off.
      </p>
      <p class="scoreline" id="scoreline" aria-live="polite">Score 0</p>
      <p class="status" id="status" role="status">Reach for the orb</p>
      <div class="camera-panel">
        <p class="camera-copy" id="camera-copy">
          Allow the camera to track your joints on-device. Nothing is uploaded.
        </p>
        <div class="actions">
          <button type="button" class="btn primary" id="start-camera">
            Allow camera
          </button>
          <button type="button" class="btn ghost" id="try-again" hidden>
            Try again
          </button>
          <a
            class="btn ghost"
            href="https://github.com/tslackey/kinect-web-game"
            >View on GitHub</a
          >
        </div>
      </div>
    </header>

    <video
      id="camera-feed"
      class="camera-feed"
      playsinline
      muted
      autoplay
    ></video>

    <script type="module" src="./main.js"></script>
  </body>
</html>
