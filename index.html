<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Kinect Web Game — a browser playground for motion play."
    />
    <title>Kinect Web Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true">
      <div class="grid"></div>
      <div class="glow glow-a"></div>
      <div class="glow glow-b"></div>
      <canvas id="motion-field" width="960" height="540"></canvas>
    </div>

    <main class="hero">
      <p class="brand">Kinect Web Game</p>
      <h1>Move. Capture. Play.</h1>
      <p class="lede">
        A lightweight browser canvas for experimenting with motion-driven play.
        More coming soon.
      </p>
      <div class="actions">
        <button type="button" id="pulse-btn" class="btn primary">
          Pulse the field
        </button>
        <a class="btn ghost" href="https://github.com/tslackey/kinect-web-game"
          >View on GitHub</a
        >
      </div>
      <p class="status" id="status" role="status">Ready.</p>
    </main>

    <script src="./app.js" type="module"></script>
  </body>
</html>
