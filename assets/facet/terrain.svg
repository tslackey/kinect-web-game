  <polygon fill="#9ece6a" points="36,50 88,78 72,86 48,128 20,128"/>
  <polygon fill="#f4efe6" points="28,62 36,50 44,62"/>

  <polygon fill="#81a75b" points="84,128 104,70 128,92 148,64 176,128"/>
  <polygon fill="#b6d78d" points="104,70 128,92 116,128 96,128"/>

  <polygon fill="#b6d78d" points="168,128 196,54 224,86 256,60 256,128"/>
  <polygon fill="#9ece6a" points="196,54 228,78 224,86 200,128 176,128"/>
  <polygon fill="#f4efe6" points="188,66 196,54 204,66"/>

  <!-- Foreground: Moss mixed toward Ink -->
  <polygon fill="#4f6341" points="0,128 8,96 56,70 96,128"/>
  <polygon fill="#749554" points="56,70 96,128 40,128"/>
  <polygon fill="#4f6341" points="88,128 120,86 152,104 184,72 216,128"/>
